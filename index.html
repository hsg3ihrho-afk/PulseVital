else if("confirm"in D){if(S.sending)return;sendBooking();return}
else if("reset"in D){S.pkg=null;S.step=1;S.date=null;S.win=null;S.done=null;S.d={};S.pc="";S.rec=null}
render()});
async function sendBooking(){
const p=P.find(x=>x.code===S.pkg),d=S.d,dt=new Date(S.date),ref="PV-"+Math.random().toString(36).slice(2,8).toUpperCase(),u=me();
const ymd=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
S.sending=true;S.sendErr=null;render();
const row={full_name:(d.name||"").trim(),email:(d.email||"").trim().toLowerCase(),phone:(d.phone||"").trim(),
address:(d.addr||"").trim(),postcode:S.pc.trim().toUpperCase(),test_name:p.name+" ("+p.code+")",test_code:p.code,price:p.price,ref,
preferred_date:ymd,preferred_time:WIN[S.win][0]+" "+WIN[S.win][1],notes:"Marketing: "+(d.mk?"yes":"no")};
if(u)row.user_id=u.id;
const {error}=await SB.from("bookings").insert(row);
S.sending=false;
if(error){S.sendErr="Sorry, we could not send your booking. Please check your connection and try again.";console.error(error);render();return}
S.done=ref;S.rec={name:row.full_name,email:row.email,phone:row.phone};S.bks=null;render()}
/* ---------- account actions & forms ---------- */
const flash=m=>{S.flash=m};
const clearForm=()=>{S.fe=null;S.ff=null;S.sent=false;S.checkMail=null};
document.addEventListener("click",async e=>{
const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a;
if(a==="theme"){const n=effTheme()==="dark"?"light":"dark";applyTheme(n);store.set("pv_theme",n);renderActs();return}
if(a==="nudge"){const r=S.rec||{};S.ff={name:r.name,email:r.email,phone:r.phone};S.fe=null;S.keep=true;go("#signup");return}
if(a==="tab"){S.tab=t.dataset.t;S.fe=null;S.ff=null;S.confirm=null;S.showData=false}
else if(a==="signout"){await SB.auth.signOut();flash("You have signed out.");S.tab=null;go("#home");return}
else if(a==="cancelask")S.confirm=t.dataset.id;
else if(a==="cancelno")S.confirm=null;
else if(a==="cancelyes"){const{error}=await SB.from("bookings").update({status:"cancelled"}).eq("id",t.dataset.id);flash(error?"Sorry, we could not cancel this booking. Please try again or contact us.":"Your booking has been cancelled.");S.confirm=null;await loadBookings()}
else if(a==="rebook"){S.pkg=t.dataset.code;S.step=2;S.done=null;S.rec=null;S.date=null;S.win=null;go("#book");return}
else if(a==="showdata")S.showData=!S.showData;
else return;
render()});
const fdata=f=>{const o={};new FormData(f).forEach((v,k)=>o[k]=v);f.querySelectorAll('input[type=checkbox]').forEach(c=>o[c.name]=c.checked);return o};
const emailOk=s=>/^\S+@\S+\.\S+$/.test(s||"");
const busy=async fn=>{S.busy=true;render();try{await fn()}finally{S.busy=false;render()}};
document.addEventListener("submit",async e=>{
const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();if(S.busy)return;
const k=f.dataset.form,d=fdata(f),er={};const u=me();
if(k==="signup"){
d.email=(d.email||"").trim().toLowerCase();d.name=(d.name||"").trim();
if(d.name.length<2)er.name="Enter your full name.";
if(!emailOk(d.email))er.email="Enter a valid email address.";
if(d.phone&&!/^[0-9 +()-]{10,}$/.test(d.phone))er.phone="Enter a valid phone number.";
if((d.pw||"").length<8)er.pw="Use at least 8 characters.";
if(d.pw!==d.pw2)er.pw2="Passwords do not match.";
if(!d.terms)er.terms="Please agree to continue.";
S.ff={name:d.name,email:d.email,phone:d.phone,terms:d.terms,mk:d.mk};
if(Object.keys(er).length){S.fe=er;render();return}
await busy(async()=>{const now=new Date().toISOString();
const{data,error}=await SB.auth.signUp({email:d.email,password:d.pw,options:{emailRedirectTo:SITE,data:{full_name:d.name,phone:d.phone||"",marketing:!!d.mk,terms_accepted_at:now}}});
if(error){S.fe={form:/registered|exists/i.test(error.message)?"An account already exists for this email. Try signing in.":/password/i.test(error.message)?"Please choose a stronger password.":"Sorry, we could not create your account. Please try again."};return}
if(data.session){S.fe=null;S.ff=null;flash("Welcome! Your account is ready.");S.tab="bookings";go("#account")}else{S.fe=null;S.checkMail=d.email}})
return}
if(k==="signin"){
const em=(d.email||"").trim().toLowerCase();S.ff={email:em};
if(!emailOk(em)){S.fe={email:"Enter a valid email address."};render();return}
await busy(async()=>{const{error}=await SB.auth.signInWithPassword({email:em,password:d.pw||""});
if(error){S.fe={form:/confirm/i.test(error.message)?"Please confirm your email first – check your inbox for the link.":/rate|many/i.test(error.message)?"Too many attempts. Please wait a few minutes and try again.":"Email or password is incorrect."};return}
S.fe=null;S.ff=null;flash("Signed in.");S.tab="bookings";go("#account")})
return}
if(k==="forgot"){
if(!emailOk(d.email)){S.fe={email:"Enter a valid email address."};render();return}
await busy(async()=>{await SB.auth.resetPasswordForEmail(d.email.trim().toLowerCase(),{redirectTo:SITE});S.fe=null;S.sent=true})
return}
if(k==="newpw"){
if((d.pw||"").length<8)er.pw="Use at least 8 characters.";
if(d.pw!==d.pw2)er.pw2="Passwords do not match.";
if(Object.keys(er).length){S.fe=er;render();return}
await busy(async()=>{const{error}=await SB.auth.updateUser({password:d.pw});
if(error){S.fe={form:/same|different/i.test(error.message)?"Choose a password you have not used before.":"Sorry, we could not save your new password. Please request a new link."};return}
S.fe=null;flash("Your new password has been saved.");S.tab="bookings";go("#account")})
return}
if(!u){go("#signin");return}
if(k==="details"){
d.name=(d.name||"").trim();
if(d.name.length<2)er.name="Enter your full name.";
if(d.phone&&!/^[0-9 +()-]{10,}$/.test(d.phone))er.phone="Enter a valid phone number.";
if(Object.keys(er).length){S.fe=er;S.ff=d;render();return}
await busy(async()=>{const{error}=await SB.from("profiles").update({full_name:d.name,phone:d.phone||"",address:(d.addr||"").trim(),postcode:(d.pc||"").trim().toUpperCase()}).eq("id",u.id);
if(error){flash("Sorry, we could not save your details. Please try again.");return}
await loadProfile();flash("Your details have been saved.");S.fe=null;S.ff=null})
return}
if(k==="password"){
if((d.pw||"").length<8)er.pw="Use at least 8 characters.";
if(d.pw!==d.pw2)er.pw2="Passwords do not match.";
if(Object.keys(er).length){S.fe=er;render();return}
await busy(async()=>{const chk=await SB.auth.signInWithPassword({email:u.email,password:d.cur||""});
if(chk.error){S.fe={cur:"Current password is incorrect."};return}
const{error}=await SB.auth.updateUser({password:d.pw});
if(error){S.fe={pw:/same|different/i.test(error.message)?"Choose a password you have not used before.":"Sorry, we could not change your password."};return}
flash("Password changed.");S.fe=null})
return}
if(k==="privacy"){await busy(async()=>{const{error}=await SB.from("profiles").update({marketing:!!d.mk,marketing_consent_at:d.mk?new Date().toISOString():null}).eq("id",u.id);await loadProfile();flash(error?"Sorry, we could not save your preference.":"Preference saved.")});return}
if(k==="delete"){
if((d.confirm||"").trim()!=="DELETE"){S.fe={del:"Type DELETE exactly to confirm."};render();return}
await busy(async()=>{const{error}=await SB.rpc("delete_my_account");
if(error){S.fe={del:"Sorry, we could not delete your account. Please contact us."};return}
await SB.auth.signOut();flash("Your account has been deleted.");S.fe=null;S.tab=null;go("#home")})
return}
});
app.addEventListener("input",e=>{const t=e.target;
if(t.id==="q"){S.q=t.value;const pos=t.selectionStart;render();const q=$("#q");q.focus();q.setSelectionRange(pos,pos)}
else if(t.id==="sel"){S.pkg=t.value||null;render()}
else if(t.id==="pc"){S.pc=t.value;const pos=t.selectionStart;render();const q=$("#pc");q.focus();q.setSelectionRange(pos,pos)}
else if(t.dataset.f){S.d[t.dataset.f]=t.type==="checkbox"?t.checked:t.value}});
render();
/* ---------- auth session ---------- */
const linkErr=/error_code=|error=/.test(H0)&&!/access_token/.test(H0);
if(linkErr){S.flash="This link has expired or was already used. Please try again.";history.replaceState(null,"",SITE+"#signin");render()}
SB.auth.onAuthStateChange((ev,session)=>{setTimeout(async()=>{
const was=!!S.user;S.user=session?session.user:null;
if(!S.user){S.profile=null;S.bks=null}else if(!was||ev==="USER_UPDATED")await loadProfile();
const first=!S.authReady;S.authReady=true;
if(ev==="PASSWORD_RECOVERY"||(first&&/type=recovery/.test(H0)&&S.user)){history.replaceState(null,"",SITE+"#newpw");render();return}
if(first&&/access_token/.test(H0)&&S.user){S.flash="Your email is confirmed – welcome to PulseVital!";S.tab="bookings";history.replaceState(null,"",SITE+"#account")}
if(location.hash==="#account"&&S.user&&!S.bks&&!S.bksLoading){await loadBookings()}
render()},0)});
</script>
